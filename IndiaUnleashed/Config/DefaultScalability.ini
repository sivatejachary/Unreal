; ============================================================================
; INDIA UNLEASHED - DefaultScalability.ini (UE 5.4 / Android Scalable)
; Low (0), Medium (1), High (2), Ultra (3), Cinematic (4)
; ============================================================================

[ScalabilitySettings]
PerfIndexValues_ResolutionQuality="50 71 87 100 100"

; ---------------- Shadow Quality ----------------
[ShadowQuality@0]
r.ShadowQuality=0
r.Shadow.MaxResolution=512
r.Shadow.DistanceScale=0.4
r.Shadow.CSM.MaxCascades=1
r.Shadow.Virtual.Enable=0

[ShadowQuality@1]
r.ShadowQuality=1
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.7
r.Shadow.CSM.MaxCascades=2
r.Shadow.Virtual.Enable=0

[ShadowQuality@2]
r.ShadowQuality=2
r.Shadow.MaxResolution=2048
r.Shadow.DistanceScale=0.85
r.Shadow.CSM.MaxCascades=3
r.Shadow.Virtual.Enable=0

[ShadowQuality@3]
r.ShadowQuality=3
r.Shadow.MaxResolution=3072
r.Shadow.DistanceScale=1.0
r.Shadow.CSM.MaxCascades=4
r.Shadow.Virtual.Enable=1

[ShadowQuality@4]
r.ShadowQuality=4
r.Shadow.MaxResolution=4096
r.Shadow.DistanceScale=1.2
r.Shadow.CSM.MaxCascades=5
r.Shadow.Virtual.Enable=1

; ---------------- Global Illumination ----------------
[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=0
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=2 ; Screen Space GI
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1 ; Lumen GI
r.Lumen.DiffuseIndirect.Allow=1

[GlobalIlluminationQuality@4]
r.DynamicGlobalIlluminationMethod=1 ; Cinematic Lumen
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.SurfaceCache.CardResolution=512

; ---------------- Reflection Quality ----------------
[ReflectionQuality@0]
r.ReflectionMethod=0
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.ReflectionMethod=2 ; Screen Space Reflections
r.Lumen.Reflections.Allow=0

[ReflectionQuality@2]
r.ReflectionMethod=2
r.Lumen.Reflections.Allow=0

[ReflectionQuality@3]
r.ReflectionMethod=1 ; Lumen Reflections
r.Lumen.Reflections.Allow=1

[ReflectionQuality@4]
r.ReflectionMethod=1 ; Cinematic Lumen Reflections
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.6

; ---------------- Post-Processing ----------------
[PostProcessQuality@0]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0
r.BloomQuality=1
r.TonemapperFilm=1

[PostProcessQuality@1]
r.MotionBlurQuality=1
r.AmbientOcclusionLevels=1
r.DepthOfFieldQuality=1
r.BloomQuality=2
r.TonemapperFilm=1

[PostProcessQuality@2]
r.MotionBlurQuality=2
r.AmbientOcclusionLevels=2
r.DepthOfFieldQuality=1
r.BloomQuality=3
r.TonemapperFilm=1

[PostProcessQuality@3]
r.MotionBlurQuality=3
r.AmbientOcclusionLevels=3
r.DepthOfFieldQuality=2
r.BloomQuality=4
r.TonemapperFilm=1

[PostProcessQuality@4]
r.MotionBlurQuality=4
r.AmbientOcclusionLevels=4
r.DepthOfFieldQuality=2
r.BloomQuality=5
r.TonemapperFilm=1

; ---------------- Foliage Quality ----------------
[FoliageQuality@0]
foliage.DensityScale=0.3
grass.DensityScale=0.3

[FoliageQuality@1]
foliage.DensityScale=0.6
grass.DensityScale=0.6

[FoliageQuality@2]
foliage.DensityScale=0.8
grass.DensityScale=0.8

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[FoliageQuality@4]
foliage.DensityScale=1.2
grass.DensityScale=1.2
