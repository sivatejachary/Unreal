; INDIA UNLEASHED - Android Scalable Device Profiles
; Configured for PUBG/BGMI Mobile Optimization across 5 Hardware Tiers
; Adheres to Section 7 & Section 10 Architecture Specifications

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.Mobile.DisableVertexFog=0
+CVars=r.MobileMSAA=2
+CVars=r.ForwardShading=1
+CVars=r.PostProcessing.DisableDomeLOD=1

